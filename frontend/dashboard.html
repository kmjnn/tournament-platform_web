<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Дашборд</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">Турнирная платформа</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="create-tournament.html">Создать турнир</a>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Выйти</button>
      </div>
    </div>
  </nav>

  <div class="container mt-5 pt-4">
    <h1>Турниры</h1>
    <table class="table">
      <thead><tr><th>Название</th><th>Игра</th><th>Тип</th><th>Статус</th></tr></thead>
      <tbody id="tournamentList"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Проверка авторизации
    if (!localStorage.getItem('token')) {
      window.location.href = 'login.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });

    async function loadTournaments() {
      const list = document.getElementById('tournamentList');
      const data = await apiRequest('/tournaments');
      list.innerHTML = '';
      data.forEach(t => {
        list.innerHTML += `<tr>
          <td><a href="tournament.html?id=${t.id}">${t.title}</a></td>
          <td>${t.game}</td>
          <td>${t.type}</td>
          <td>${t.status}</td>
        </tr>`;
      });
    }
    loadTournaments();
  </script>
</body>
</html>
