<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Турнир</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <a href="dashboard.html" class="btn btn-secondary mb-3">← Назад</a>
    <h1 id="title"></h1>
    <p><strong>Статус:</strong> <span id="status"></span></p>
    <div id="tournamentDetails" style="display:none;">
      <p><strong>Игра/Вид спорта:</strong> <span id="game"></span></p>
      <p><strong>Тип:</strong> <span id="type"></span></p>
      <p><strong>Формат:</strong> <span id="format"></span></p>
      <p><strong>Описание:</strong> <span id="description"></span></p>
      <p><strong>Начало:</strong> <span id="startDate"></span></p>
      <p><strong>Дедлайн регистрации:</strong> <span id="deadline"></span></p>
      <p><strong>Команд зарегистрировано:</strong> <span id="teamsCount"></span> / <span id="maxTeams"></span></p>
      <div id="extraFields"></div>
    </div>

    <!-- Секция для участников: подать заявку -->
    <div id="registrationSection" style="display:none;">
              <div id="myRequestStatus" class="mb-3"></div>

      <h3>Подать заявку</h3>
      <form id="registerForm">
        <div class="mb-3">
          <label>Тип заявки</label>
          <select id="regType" class="form-select">
            <option value="solo">Одиночная (ищу команду)</option>
            <option value="team">Создать команду</option>
          </select>
        </div>
        <div class="mb-3" id="teamNameGroup" style="display:none;">
          <label>Название команды</label>
          <input type="text" id="teamName" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">Отправить заявку</button>
      </form>
    </div>

    <!-- Секция организатора -->
    <div id="organizerSection" style="display:none;">
      <h3>Управление турниром</h3>
      <button id="startBracketBtn" class="btn btn-warning" style="display:none;">Сгенерировать сетку</button>
      <button id="rescheduleBtn" class="btn btn-info">Перенести турнир</button>
      <h4 class="mt-3">Заявки</h4>
      <div id="requestsList"></div>
    </div>

    <!-- Сетка матчей -->
    <div id="bracketSection" style="display:none;">
      <h3>Сетка</h3>
      <div id="bracket"></div>
    </div>

    <!-- Ввод результата (для организатора) -->
    <div id="resultSection" style="display:none;">
      <h3>Внести результат матча</h3>
      <form id="resultForm">
        <div class="mb-3">
          <label>ID матча</label>
          <input type="number" id="matchId" class="form-control" required>
        </div>
        <div class="row">
          <div class="col">
            <label>Счёт команды 1</label>
            <input type="number" id="score1" class="form-control" required>
          </div>
          <div class="col">
            <label>Счёт команды 2</label>
            <input type="number" id="score2" class="form-control" required>
          </div>
        </div>
        <div class="mb-3 mt-2">
          <label>ID победителя</label>
          <input type="number" id="winnerId" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </form>
    </div>

    <!-- Модальное окно переноса -->
    <div class="modal fade" id="rescheduleModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Перенос турнира</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <label>Новая дата и время</label>
            <input type="datetime-local" id="newDate" class="form-control">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
            <button type="button" id="confirmReschedule" class="btn btn-primary">Сохранить</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/match.js"></script>
</body>
</html>
